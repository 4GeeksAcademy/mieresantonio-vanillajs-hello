<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Generador de Cartas Aleatorias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link 
    rel="stylesheet" 
    type="text/css" 
    href="style.css" 
    integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
    crossorigin="anonymous/">
  </head>
  <body>
    
    <!-- Write your HTML code here, you can delete everything withing the body tags -->

    <div class="controls">
      <button id="btn-nueva-carta">Generar Nueva Carta</button>
      <div>
        <label>Ancho (px): <input type="number" id="input-ancho" placeholder="ej. 250"></label>
        <label>Alto (px): <input type="number" id="input-alto" placeholder="ej. 350"></label>
      </div>
    </div>

    <!-- Contenedor principal de la carta -->

    <div id="card" class="card">
      <div class="top-suit"></div>
      <div class="number"></div>
      <div class="bottom-suit"></div>
    </div>

    <div class="fixed-bottom">
      Made with ❤️ by <a href="https://github.com/mieresantonio" target="_blank">Antonio Mieres</a>
    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="app.js"></script>
  </body>
</html>
